<!DOCTYPE html>
<html>
<head>
    <title>SPEED CRASHOUT</title>
    <style>
        body { background: black; overflow: hidden; margin: 0; }
        .speed-box {
            position: absolute;
            width: 250px;
            padding: 10px;
            background: black;
            border: 5px solid red;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            font-weight: bold;
            user-select: none;
        }
        img { width: 100%; display: block; }
        h2 { margin: 5px 0; font-size: 14px; }
    </style>
</head>
<body>

<script>
    // 1. SOUND SYSTEM
    const audio = new Audio('bark.mp3');
    function playBark() {
        audio.play().catch(() => {}); // Browsers block auto-play until you click once
        setTimeout(playBark, 5000);
    }

    // 2. BOUNCING & SHAKING SYSTEM
    function createSpeedBox() {
        const box = document.createElement('div');
        box.className = 'speed-box';
        box.innerHTML = '<h2>BARK BARK BARK SPEED!</h2><img src="speed.jpg">';
        document.body.appendChild(box);

        let x = Math.random() * (window.innerWidth - 250);
        let y = Math.random() * (window.innerHeight - 300);
        let dx = 7, dy = 7;

        function animate() {
            x += dx; y += dy;
            
            // Wall Bounce
            if (x <= 0 || x >= window.innerWidth - 270) dx *= -1;
            if (y <= 0 || y >= window.innerHeight - 320) dy *= -1;

            // Violent Shake
            let shakeX = x + (Math.random() * 20 - 10);
            let shakeY = y + (Math.random() * 20 - 10);

            box.style.left = shakeX + 'px';
            box.style.top = shakeY + 'px';
            requestAnimationFrame(animate);
        }
        animate();
    }

    // 3. DUPLICATION SYSTEM (Every 10 seconds)
    function duplicate() {
        createSpeedBox();
        setTimeout(duplicate, 10000);
    }

    // Start everything on first click (Browser requirement)
    window.onclick = () => {
        createSpeedBox();
        playBark();
        duplicate();
        // Remove click listener so it only triggers once
        window.onclick = null; 
    };
</script>

<div style="color: white; text-align: center; margin-top: 20%; font-family: sans-serif;">
    <h1>CLICK ANYWHERE TO START THE CRASHOUT</h1>
</div>

</body>
</html>
